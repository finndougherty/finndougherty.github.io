<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Toggle Example</title>
  <style>
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      background-color: darkgreen;
      color: yellow;
      padding: 0.5rem;
    }

    button {
      height: 2.5rem;
      width: 3rem;
      border-radius: 10%;
      cursor: pointer;
      font-size: 1.2rem;
    }

    h3 {
      text-align: center;
      font-size: 1.5rem;
      margin: 0;
    }

    .card-content {
      display: none;
      padding: 0.5rem;
    }

    .expand-btn:hover {
      background-color: yellow;
      transform: scale(1.1);
    }

    .expand-btn:focus {
      background-color: rgb(147, 208, 147);
      outline: 2px solid black;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="card-header">
      <h3>Community Garden Project</h3>
      <button class="expand-btn" aria-expanded="false" aria-controls="card-content">+</button>
    </div>
    <div id="card-content" class="card-content">
      <p class="summary">Join neighbors in creating a shared growing space...</p>
      <div class="details hidden">
        <p>Meeting every Saturday at 10am. Tools provided. All skill levels welcome.</p>
        <p>Contact: garden@community.org</p>
      </div>
    </div>
  </div>

  <script>
    const expandBtn = document.querySelector('.expand-btn');
    const cardContent = document.querySelector('.card-content');

    expandBtn.addEventListener('click', toggleContent);
    expandBtn.addEventListener('keyup', function (e) {
      if (e.key === "Enter" || e.key === " ") {
        toggleContent();
      }
    });

    function toggleContent() {
      const isOpen = expandBtn.getAttribute('aria-expanded') === 'true';

      if (isOpen) {
        cardContent.style.display = "none";
        expandBtn.textContent = "+";
        expandBtn.setAttribute('aria-expanded', "false");
      } else {
        cardContent.style.display = "block";
        expandBtn.textContent = "−";
        expandBtn.setAttribute('aria-expanded', "true");
      }
    }
  </script>
</body>

</html>
