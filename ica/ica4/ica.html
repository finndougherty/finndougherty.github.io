<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://use.typekit.net/yzd0ngd.css">
    <style>
        html{
           font-family: "aglet-sans-variable", sans-serif;
            font-variation-settings: "wght" 400;
        }    
        .colorbox{
            height: 75px;
            width:  100px;
        }
        #box1{
            background-color: #FF9F1C;
        }
        #box2{
            background-color: #212922;
        }
        #box3{
            background-color: #294936;
        }
        #box4{
            background-color: #C4D6B0;
        }
        #box5{
            background-color: #C2D3CD;
        }
        p{
            font-size: 20px;
        }
        .small-text{
            font-size: 16px;
        }
        h3{
            font-size: 24px;
        }
        h2{
            font-size: 28px;
        }
        h1{
            font-size: 32px;
        }
        a{
            text-decoration: none;
            color: #FF9F1C;
        }
        a:hover{
            text-decoration: underline;
            color: #294936;
        }
        a:visited{
            color: #212922;
        }
    </style>
</head>

<body>
    <div class="colorbox" id="box1">1</div>
    <div class="colorbox" id="box2">2</div>
    <div class="colorbox" id="box3">3</div>
    <div class="colorbox" id="box4">4</div>
    <div class="colorbox" id="box5">5</div>

    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>
    <p>This is paragraph text</p>
    <p class ="small-text"> This is small text</p>
    <p><a href= "#">This is a link</a></p>



</body>
</html>
